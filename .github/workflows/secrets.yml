name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
