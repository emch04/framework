name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      workspace:
        # Saisie libre plutot qu'une liste : GitHub plafonne les listes de choix
        # a vingt options, et le depot en compte davantage. Un nom fautif fait
        # echouer `npm publish --workspace` immediatement, sans rien publier.
        description: 'Nom npm du workspace, ex. @astratra/notify ou create-astratra-app'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      WORKSPACE: ${{ inputs.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm pack --workspace "$WORKSPACE" --dry-run

      - name: Publish with npm provenance
        run: npm publish --workspace "$WORKSPACE" --access public --provenance
